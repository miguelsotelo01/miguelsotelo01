name: Update GitHub Activity in README

# ¿Cuándo se va a ejecutar este script?
on:
  schedule:
    # Se ejecutará automáticamente cada 12 horas (formato Cron)
    - cron: "0 */12 * * *"
  workflow_dispatch: # Esto te permite ejecutar el script manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest
    name: Actualizar README con la actividad
    permissions:
      contents: write # Este permiso es vital para que el bot pueda sobrescribir tu README

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      
      - name: Actualizar la sección de actividad
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "⚡ Auto-update: Actividad reciente agregada al README"
          MAX_LINES: 5 # Cantidad máxima de actividades que mostrará
